[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tunesort"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["rich", "questionary>=2.0.0", "python-dotenv"]

[project.scripts]
tunesort = "tunesort.main:main"

[tool.setuptools.packages.find]
where = ["src"]